<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гардероб</title>
<meta name="description" content="Примерочная для большого гардероба: 3D-манекен, свои вещи по фото, посадка и силуэт.">
<meta name="theme-color" content="#171718">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гардероб">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#171718;--s1:#202022;--s2:#2b2b2e;--tx:#ecebe7;--mu:#8f8e8a;--bone:#d8d4ca;--ln:#2f2f32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:520px;margin:0 auto;height:100%;overflow-y:auto;padding:20px 20px 130px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
h2{font-size:19px;font-weight:700;margin:28px 0 12px;letter-spacing:-.01em}
.mu{color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.search{display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:999px;padding:12px 16px;margin:18px 0 16px;color:var(--mu)}
.search input{flex:1;background:none;border:0;color:var(--tx);font:inherit;min-width:0}
.search input::placeholder{color:var(--mu)}
.search input:focus-visible{outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--ln);color:var(--mu);font-weight:500}
.chip[aria-pressed=true]{background:var(--bone);color:#1a1a1a;border-color:var(--bone);font-weight:700}
.hero{position:relative;border-radius:28px;padding:22px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#2a2a2c;margin-top:18px;text-align:left;width:100%}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#2f2f32 0 3px,#292a2c 3px 6px);opacity:.9}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:210px;height:210px;border-radius:50%;border:1px solid #4a4a4e;box-shadow:0 0 0 24px #ffffff05,0 0 0 48px #ffffff04}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:13px;color:var(--mu);margin-bottom:8px}
.hero .t{font-size:25px;line-height:1.18;font-weight:800;letter-spacing:-.015em;max-width:15em}
.pill{display:inline-block;align-self:flex-start;margin-top:16px;background:var(--bone);color:#1a1a1a;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:24px;text-align:left;position:relative}
.sw{height:96px;border-radius:18px;margin:8px 8px 0}
.rail .card{flex:none;width:156px;scroll-snap-align:start;padding-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{padding-bottom:14px}
.card .n{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{display:block;width:100%;margin-top:14px;padding:14px;border:1px solid var(--ln);border-radius:999px;font-weight:700;color:var(--tx);background:var(--s1)}
.card .b{padding:12px 14px 0}
.card .n{font-weight:700;line-height:1.25}
.card .s{font-size:13px;color:var(--mu);margin-top:4px}
.heart{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#171718b3;display:grid;place-items:center;z-index:2}
.heart svg{width:18px;height:18px}
.heart[aria-pressed=true] svg{fill:var(--bone);stroke:var(--bone)}
.row{display:flex;gap:14px;align-items:center;padding:12px;background:var(--s1);border:1px solid var(--ln);border-radius:22px;margin-bottom:10px;width:100%;text-align:left;position:relative}
.row .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.row .ic svg{width:22px;height:22px}
.row .n{font-weight:700;line-height:1.25}
.row .s{font-size:13px;color:var(--mu)}
.row .heart{position:static;margin-left:auto;flex:none;background:var(--s2)}
.row>div:nth-child(2){min-width:0}
.fab{background:var(--bone);color:#1a1a1a;border-radius:999px;padding:13px 20px;font-weight:700}
.field{display:flex;gap:8px;margin:14px 0 6px}
.field input,.field select{background:var(--s1);border:1px solid var(--ln);border-radius:999px;color:var(--tx);padding:12px 16px;font:inherit;min-width:0}
.field input{flex:1}
.empty{border:1px dashed #404044;border-radius:24px;padding:28px 20px;text-align:center;color:var(--mu)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px;background:#242426ee;border:1px solid var(--ln);border-radius:999px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20}
.nav button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--mu);background:var(--s2);transition:background .2s,color .2s}
.nav button[aria-current=page]{background:var(--bone);color:#1a1a1a}
.nav svg{width:23px;height:23px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:30;display:none}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--s1);border-radius:30px 30px 0 0;padding:14px 22px calc(28px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:#48484c;margin:0 auto 18px}
.sheet .sw{margin:0 0 16px;height:120px}
.sheet h3{margin:0 0 6px;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.sheet p{color:#c9c8c3;margin:10px 0}
.facts{margin:16px 0;border-top:1px solid var(--ln)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--ln)}
.facts span:first-child{color:var(--mu)}
.facts span:last-child{text-align:right}
.av{width:84px;height:84px;border-radius:50%;background:var(--s2);display:grid;place-items:center;margin:18px 0 12px}
.av svg{width:36px;height:36px}
.wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wh b{font:500 15px 'IBM Plex Mono',monospace;letter-spacing:.02em}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;font:500 12px 'IBM Plex Mono',monospace;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--bone);color:#1a1a1a}
.stage{display:grid;grid-template-columns:1.05fr 1fr;gap:8px;height:500px;padding:10px;border-radius:30px;background:linear-gradient(160deg,#3c3c40,#1f1f22 70%);border:1px solid var(--ln)}
.pn{background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.sr{display:flex;gap:6px;align-items:center;background:#161617;border:1px solid var(--ln);border-radius:10px;padding:7px 9px;color:var(--mu)}
.sr svg{width:15px;height:15px;flex:none}
.sr input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:12px 'IBM Plex Mono',monospace}
.sr input:focus-visible{outline:0}
.pn .chip{padding:5px 10px;font:500 11px 'IBM Plex Mono',monospace}
.tg{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:124px;gap:8px;padding:2px;overflow-y:auto;margin-top:8px;flex:1;min-height:0;align-content:start;scrollbar-width:thin}
.tl{position:relative;background:transparent;border-radius:16px;min-height:0;display:flex;flex-direction:column;overflow:hidden;color:var(--tx);border:1.5px solid rgba(255,255,255,.35);text-align:left}
.tl svg{flex:1 1 0;height:0;min-height:0;width:100%;padding:8px 6px 0}
.tl span{font:500 9.5px/1.2 'IBM Plex Mono',monospace;padding:0 6px 6px}
.tl em{position:absolute;left:6px;top:5px;font:700 8.5px 'IBM Plex Mono',monospace;font-style:normal;color:var(--mu)}
.tl[aria-pressed=true]{border-color:var(--bone);box-shadow:0 0 0 1.5px var(--bone)}
.ck{display:none;position:absolute;right:5px;bottom:5px;width:18px;height:18px;border-radius:50%;background:#7c7c80;color:#fff;font:700 11px/18px sans-serif;text-align:center;font-style:normal}
.tl[aria-pressed=true] .ck{display:block}
.tl.add{background:transparent;border:1.5px dashed rgba(255,255,255,.3);box-shadow:none;color:var(--mu);align-items:center;justify-content:center;gap:4px}
.tl.add b{font-size:26px;font-weight:400;line-height:1}
.tl .dx{position:absolute;right:4px;top:4px;width:18px;height:18px;padding:0;border-radius:50%;background:#0005;color:#fff;font-size:12px;line-height:18px;text-align:center}
.mq{position:relative;border-radius:22px;background:transparent;overflow:hidden;min-width:0}
#m3,#m2{width:100%;height:100%}#m3{display:none}
#m3 canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
.vt{position:absolute;left:8px;top:8px;z-index:2;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:#17171acc;font:500 11px 'IBM Plex Mono',monospace}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:400 10px 'IBM Plex Mono',monospace;color:var(--mu);pointer-events:none}
.mq svg{display:block;width:100%;height:100%}
.ob{display:flex;gap:8px;margin-top:12px}
.ob .fab{flex:1;font-family:'IBM Plex Mono',monospace;font-size:14px}
.ghost{padding:13px 18px;border:1px solid var(--ln);border-radius:999px;font:500 14px 'IBM Plex Mono',monospace}
.pv{padding:10px;text-align:center;color:var(--mu);font-size:13px;border-radius:14px;margin-bottom:10px;background:repeating-conic-gradient(#2c2c2f 0 25%,#242426 0 50%) 0 0/16px 16px}
.pv img{display:block;margin:0 auto;max-height:150px;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const isFav=id=>st.favs.includes(id);
const heart=id=>`<button class="heart" data-fav="${id}" aria-pressed="${isFav(id)}" aria-label="В избранное">${ic('heart')}</button>`;

function card(d){return `<div class="card" data-open="${d.id}">${heart(d.id)}<button data-open="${d.id}" style="display:block;width:100%;text-align:left"><div class="sw" style="background:${SW[d.sw]}"></div><div class="b"><div class="n">${d.n}</div><div class="s">${d.k}</div></div></button></div>`}
function row(d){return `<div class="row" style="padding:12px 12px 12px 12px"><button data-open="${d.id}" style="display:flex;gap:14px;align-items:center;text-align:left;flex:1;min-width:0"><div class="sw" style="width:52px;height:52px;margin:0;border-radius:50%;flex:none;background:${SW[d.sw]}"></div><div><div class="n">${d.n}</div><div class="s">${d.s}</div></div></button>${heart(d.id)}</div>`}

const SECS=[['brand','Бренды'],['news','Новости моды'],['acc','Аксессуары'],['care','Уход за вещами'],['fabric','Ткани']];
function section(k,l,items){
 if(!items.length)return '';
 const c=st.n[k]||6;
 return `<h2>${l}</h2><div class="grid">${items.slice(0,c).map(card).join('')}</div>`+(items.length>c?`<button class="more" data-more="${k}">Показать ещё ${Math.min(10,items.length-c)}</button>`:'');
}
function home(){
 const q=st.q.trim().toLowerCase();
 let list=DATA.filter(d=>(st.f==='all'||d.t===st.f)&&(!q||(d.n+d.s+d.x).toLowerCase().includes(q)));
 const feat=DATA[0];
 let h=`
 <label class="search">${ic('search').replace('<svg','<svg width="20" height="20"')}<input id="q" type="search" placeholder="Ткани, тренды, уход" value="${esc(st.q)}" aria-label="Поиск"></label>
 <div class="chips" role="group" aria-label="Разделы">${FILT.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${st.f===k}">${l}</button>`).join('')}</div>`;
 if(st.f==='all'&&!q) h+=`<button class="hero" data-open="${feat.id}"><div class="k">${feat.k}</div><div class="t">${feat.n}</div><span class="pill">Читать</span></button>`;
 if(!list.length) return h+`<div class="empty" style="margin-top:20px">Ничего не нашли. Попробуйте другое слово.</div>`;
 if(st.f==='all'&&!q){
  h+=SECS.map(([k,l])=>section(k,l,DATA.filter(d=>d.t===k))).join('');
 } else h+=section(st.f==='all'?'q':st.f,q?'Результаты':FILT.find(x=>x[0]===st.f)[1],list);
 return h;
}
function wardrobeOld(){
 let h=`<div class="mu">Ваши вещи</div><h1>Гардероб</h1>
 <div class="field"><input id="wn" placeholder="Название вещи" aria-label="Название вещи"><select id="wc" aria-label="Категория">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
 <button class="fab" id="wadd" style="width:100%">Добавить вещь</button>`;
 if(!st.wd.length) return h+`<div class="empty" style="margin-top:20px">Здесь пока пусто. Добавьте первую вещь, и она появится в своей категории.</div>`;
 CATS.forEach(c=>{const l=st.wd.map((w,i)=>({...w,i})).filter(w=>w.c===c);if(!l.length)return;
  h+=`<h2>${c} <span class="mu" style="font-weight:500">${l.length}</span></h2>`+l.map(w=>`<div class="row"><div class="ic">${ic('hang')}</div><div style="flex:1"><div class="n">${esc(w.n)}</div></div><button class="heart" data-del="${w.i}" aria-label="Удалить" style="font-size:20px;line-height:1">×</button></div>`).join('')});
 return h;
}
function favs(){
 const l=DATA.filter(d=>isFav(d.id));
 return `<div class="mu">Сохранённое</div><h1>Избранное</h1>`+(l.length?`<div style="margin-top:16px">${l.map(row).join('')}</div>`:`<div class="empty" style="margin-top:20px">Нажмите на сердечко у статьи, ткани или аксессуара, и они появятся здесь.</div>`);
}
function me(){
 return `<div class="av">${ic('user')}</div><h1>Гость</h1><div class="mu">Войдите, чтобы гардероб сохранялся на всех устройствах</div>

 <div class="row"><div><div class="n">Размеры</div><div class="s">Не указаны</div></div></div>`;
}
function render(){
 $('#app').innerHTML={home,wardrobe,favs,me}[st.tab]();
 $('.nav').innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}" aria-label="${l}" ${st.tab===k?'aria-current="page"':''}>${ic(i)}</button>`).join('');
}
function open(id){
 const d=DATA.find(x=>x.id===id);
 $('#sheet').innerHTML=`<div class="grab"></div><div class="sw" style="background:${SW[d.sw]}"></div><div class="mu">${d.k}</div><h3>${d.n}</h3><p>${d.x}</p>${d.f?`<div class="facts">${d.f.map(a=>`<div><span>${a[0]}</span><span>${a[1]}</span></div>`).join('')}</div>`:''}<button class="fab" data-fav="${d.id}" id="sf" style="width:100%">${isFav(d.id)?'Убрать из избранного':'В избранное'}</button>`;
 $('#bg').classList.add('on');
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-f],[data-open],[data-fav],[data-del],[data-more],#wadd');if(!t)return;
 if(t.dataset.more){const k=t.dataset.more;st.n[k]=(st.n[k]||6)+10;const y=$('#app').scrollTop;render();$('#app').scrollTop=y;return}
 if(t.dataset.tab){st.tab=t.dataset.tab;render();$('#app').scrollTop=0;return}
 if(t.dataset.f){st.f=t.dataset.f;render();return}
 if(t.dataset.fav){const id=t.dataset.fav;st.favs=isFav(id)?st.favs.filter(x=>x!==id):[...st.favs,id];save();
  if($('#bg').classList.contains('on')){$('#sf').textContent=isFav(id)?'Убрать из избранного':'В избранное'}
  const y=$('#app').scrollTop;render();$('#app').scrollTop=y;e.stopPropagation();return}
 if(t.dataset.open){if(e.target.closest('[data-fav]'))return;open(t.dataset.open);return}
 if(t.dataset.del!==undefined){st.wd.splice(+t.dataset.del,1);save();render();return}
 if(t.id==='wadd'){const n=$('#wn').value.trim();if(!n){$('#wn').focus();return}st.wd.push({n,c:$('#wc').value});save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
$('#bg').addEventListener('click',e=>{if(e.target.id==='bg')e.target.classList.remove('on')});
